<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bento PDV — Cardápio</title>
<style>body{margin:0;background:#111;color:#faf5ea;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}a{color:#ffc15a}h1{color:#ffc15a}button,input,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #555}button{background:#e9a52b;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}input,select{background:#252525;color:white;max-width:100%}.categoria-titulo{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;color:#ffc15a;margin:10px 0;border:1px solid #555;background:#303030;padding:16px;border-radius:10px}.categoria-titulo:hover,.categoria-titulo[aria-expanded="true"]{background:#40351f}.categoria-conteudo{padding:0 4px 12px}.categoria-conteudo[hidden]{display:none}.item{padding:15px;border-bottom:1px solid #444;display:flex;justify-content:space-between;gap:10px}.panel{background:#222;border-radius:12px;padding:18px;margin:20px 0}.hidden{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}small{color:#bbb}#msg{white-space:pre-wrap;color:#ffcf78}.escolhas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.escolha{min-height:148px;background:linear-gradient(145deg,#302a20,#171717);color:#fff;border:2px solid #494034;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 25px #0005}.escolha .emoji{font-size:40px}.escolha strong{font-size:19px}.escolha.active{border-color:#ffc15a;background:linear-gradient(145deg,#513c1c,#252017)}.campo-veiculo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.campo-veiculo label{display:flex;flex-direction:column;gap:8px;color:#ffc15a;font-weight:700}.campo-veiculo input{width:100%;box-sizing:border-box}.continuar{width:100%;margin-top:14px}.aviso{background:#3a2c12;border:1px solid #e9a52b;border-radius:10px;padding:14px;margin-top:14px}.etapa{margin-top:14px}#area-cardapio[hidden],#gpsbox[hidden],#carbox[hidden]{display:none}@media(max-width:600px){.campo-veiculo{grid-template-columns:1fr}.escolha{min-height:128px}.escolha strong{font-size:16px}} </style>
<header><strong>🍔 BENTO PDV</strong><a href="/login/">Acesso funcionários</a></header>
<main><h1>Faça seu pedido</h1><p>Escolha como deseja retirar seu pedido. Não precisa de cadastro.</p>
<div class="panel" id="entrada"><div class="escolhas">
<button class="escolha" id="escolhergps" type="button"><span class="emoji">🚗</span><strong>Estou a caminho</strong><small>Ativar GPS</small></button>
<button class="escolha" id="escolhercarro" type="button"><span class="emoji">🅿️</span><strong>Estou estacionado</strong><small>Identificar meu carro</small></button>
</div>
<div id="gpsbox" hidden class="etapa"><p id="gpsaviso" role="alert" class="aviso">Por favor. Não fechar o navegador para que o GPS não perca à referência.</p><small id="gpsstatus">Solicitando autorização de localização...</small><p><button id="gpsbtn" type="button">Tentar ativar GPS novamente</button></p></div>
<div id="carbox" hidden class="etapa"><div class="campo-veiculo"><label>🚙 Carro<input id="modelo" placeholder="Ex.: Onix" maxlength="50" autocomplete="off"></label><label>🎨 Cor<input id="cor" placeholder="Ex.: Branco" maxlength="30" autocomplete="off"></label><label>🔢 Final da placa<input id="placa" placeholder="Ex.: 1A23" maxlength="4" autocomplete="off"></label></div><button id="continuarcarro" class="continuar" type="button">Ver cardápio →</button></div>
</div><section id="area-cardapio" hidden>
<div id="produtos" class="panel">Carregando cardápio...</div>
<div class="panel"><h2>Seu pedido</h2><div id="resumo">Carrinho vazio</div><p><input id="nome" placeholder="Nome ou apelido" maxlength="70"></p><button id="pedir">Gerar cobrança Pix</button><p id="msg" role="status"></p><div id="cobranca"></div><div id="chegada" class="hidden" style="margin-top:16px"><button id="chegueibtn" type="button">🚗 CHEGUEI</button><p id="chegueistatus" role="status"></p></div></section></main>
<script>
const API='https://bento-pdv.onrender.com';
let catalogo=[],carrinho={},gps=null,watchId=null,pedido=null,access=null,demo=false,modo=null;
try{carrinho=JSON.parse(localStorage.getItem('bento_pdv_carrinho')||'{}')||{}}catch{carrinho={}}
const produtosDemo=[{id:'demo-1',nome:'X-Burger',preco:18.9,categoria:'Lanches'},{id:'demo-2',nome:'X-Salada',preco:22.9,categoria:'Lanches'},{id:'demo-3',nome:'X-Bacon',preco:27.9,categoria:'Lanches'},{id:'demo-4',nome:'X-Tudo',preco:32.9,categoria:'Lanches'},{id:'demo-5',nome:'Combo X-Burger + Refrigerante Lata',preco:24.9,categoria:'Combos'},{id:'demo-6',nome:'Combo X-Bacon + Refrigerante Lata',preco:33.9,categoria:'Combos'},{id:'demo-7',nome:'Combo Duplo + Refrigerante Lata',preco:39.9,categoria:'Combos'},{id:'demo-8',nome:'Refrigerante Cola Lata 350 ml',preco:7,categoria:'Bebidas'},{id:'demo-9',nome:'Refrigerante Guaraná Lata 350 ml',preco:7,categoria:'Bebidas'},{id:'demo-10',nome:'Refrigerante Laranja Lata 350 ml',preco:7,categoria:'Bebidas'}];
const $=id=>document.getElementById(id), dinheiro=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function tipo(){return modo}
function escolher(t){modo=t; $('escolhergps').classList.toggle('active',t==='gps');$('escolhercarro').classList.toggle('active',t==='estacionado');$('gpsbox').hidden=t!=='gps';$('carbox').hidden=t!=='estacionado';$('area-cardapio').hidden=true;sessionStorage.setItem('bento_pdv_modo',t);if(t==='gps')ativarGps();}
function abrirCardapio(){$('area-cardapio').hidden=false;$('area-cardapio').scrollIntoView({behavior:'smooth',block:'start'});}
$('escolhergps').onclick=()=>escolher('gps');
$('escolhercarro').onclick=()=>escolher('estacionado');
$('continuarcarro').onclick=()=>{if(!$('modelo').value.trim()||!$('cor').value.trim()||!$('placa').value.trim()){alert('Informe carro, cor e final da placa.');return;}sessionStorage.setItem('bento_pdv_veiculo',JSON.stringify({modelo:$('modelo').value.trim(),cor:$('cor').value.trim(),placa:$('placa').value.trim()}));abrirCardapio()};
function ativarGps(){ $('gpsstatus').textContent='Solicitando autorização de localização...';if(!navigator.geolocation){$('gpsstatus').textContent='GPS indisponível neste dispositivo.';return;}
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gpsstatus').textContent='📍 Localização ativa. Mantenha esta página aberta.';if($('area-cardapio').hidden)abrirCardapio();if(pedido&&access)fetch(API+'/publico/pedidos/'+pedido+'/gps',{method:'POST',headers:{'Content-Type':'application/json','X-Pedido-Token':access},body:JSON.stringify(gps)}).catch(()=>{})},e=>{$('gpsstatus').textContent='Localização não autorizada ou indisponível: '+e.message},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});}
$('gpsbtn').onclick=ativarGps;
try{const v=JSON.parse(sessionStorage.getItem('bento_pdv_veiculo')||'null');if(v){$('modelo').value=v.modelo||'';$('cor').value=v.cor||'';$('placa').value=v.placa||''}}catch{}
function desenhar(){
 $('produtos').innerHTML='';
 for(const categoria of ['Lanches','Combos','Bebidas']){
  const itens=catalogo.filter(i=>String(i.categoria||'').toLowerCase()===categoria.toLowerCase());
  if(!itens.length)continue;
  const botao=document.createElement('button');botao.type='button';botao.className='categoria-titulo';botao.setAttribute('aria-expanded','false');
  const titulo=document.createElement('span');titulo.textContent=({Lanches:'🍔 Lanches',Combos:'🍟 Combos',Bebidas:'🥤 Bebidas'})[categoria];
  const seta=document.createElement('span');seta.textContent='＋';seta.setAttribute('aria-hidden','true');botao.append(titulo,seta);
  const conteudo=document.createElement('div');conteudo.className='categoria-conteudo';conteudo.hidden=true;
  botao.onclick=()=>{
   const abrir=conteudo.hidden;
   document.querySelectorAll('.categoria-conteudo').forEach(el=>el.hidden=true);
   document.querySelectorAll('.categoria-titulo').forEach(el=>{el.setAttribute('aria-expanded','false');el.lastElementChild.textContent='＋'});
   if(abrir){conteudo.hidden=false;botao.setAttribute('aria-expanded','true');seta.textContent='−'}
  };
  itens.forEach(i=>{const d=document.createElement('div');d.className='item';const txt=document.createElement('span');txt.textContent=i.nome+' — '+dinheiro(i.preco);const b=document.createElement('button');b.textContent='Adicionar';b.onclick=()=>{carrinho[i.id]=(carrinho[i.id]||0)+1;resumo()};d.append(txt,b);conteudo.append(d)});
  $('produtos').append(botao,conteudo);
 }
 if(!$('produtos').children.length)$('produtos').textContent='Nenhum produto disponível nas categorias Lanches, Combos e Bebidas.';
}
function resumo(){localStorage.setItem('bento_pdv_carrinho',JSON.stringify(carrinho)); $('resumo').innerHTML='';let total=0;catalogo.forEach(i=>{let q=carrinho[i.id]||0;if(!q)return;total+=q*Number(i.preco);const d=document.createElement('p');d.textContent=q+' × '+i.nome+' — '+dinheiro(q*i.preco)+' ';const b=document.createElement('button');b.textContent='−';b.onclick=()=>{carrinho[i.id]--;resumo()};d.append(b);$('resumo').append(d)});const t=document.createElement('strong');t.textContent='Total: '+dinheiro(total);$('resumo').append(t);}
async function json(r){const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.erro||'Erro '+r.status);return x}
$('pedir').onclick=async()=>{if(!modo){$('msg').textContent='Escolha GPS ou Estacionado antes de pedir.';return;}if(demo){$('msg').textContent='Cardápio demonstrativo: pedidos e Pix desativados até a API voltar.';return;}const itens=Object.entries(carrinho).filter(([,q])=>q>0).map(([id,qty])=>({id,qty}));if(!itens.length)return $('msg').textContent='Escolha ao menos um produto.';
if(tipo()==='gps'&&!gps)return $('msg').textContent='Ative a localização GPS para pedido a caminho.';
const veiculo={modelo:$('modelo').value.trim(),cor:$('cor').value.trim(),placa:$('placa').value.trim()};
if(tipo()==='estacionado'&&(!veiculo.modelo||!veiculo.cor||!veiculo.placa))return $('msg').textContent='Informe modelo, cor e final da placa.';
$('pedir').disabled=true;try{const data=await json(await fetch(API+'/publico/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:$('nome').value.trim(),tipo:tipo(),veiculo,gps,itens})}));pedido=data.id;access=data.token;iniciarConsultaStatus();
$('msg').textContent='Pedido registrado. Aguardando emissão de cobrança pelo Sicredi.';if(data.pixCopiaCola){$('cobranca').textContent='Pix Copia e Cola: '+data.pixCopiaCola}else{$('cobranca').textContent='Pagamento indisponível até ativação da API Pix Sicredi.'}
}catch(e){$('msg').textContent=e.message}finally{$('pedir').disabled=false}};

let statusTimer=null, statusAtual='aguardando_pix';
async function consultarStatus(){
 if(!pedido||!access)return;
 try{
  const data=await json(await fetch(API+'/publico/pedidos/'+encodeURIComponent(pedido)+'/status',{headers:{'X-Pedido-Token':access},cache:'no-store'}));
  statusAtual=data.status;
  const pago=['pago','preparo','pronto','entregue'].includes(data.status);if(pago&&Object.keys(carrinho).length){carrinho={};resumo();}
  $('chegada').classList.toggle('hidden',!pago||data.tipo!=='gps'||!!data.chegou_em);
  if(data.chegou_em)$('chegueistatus').textContent='Chegada registrada! Aguarde a entrega.';
  if(data.status==='entregue'||data.status==='cancelado'){
   $('chegada').classList.add('hidden');clearInterval(statusTimer);statusTimer=null;
  }
 }catch(e){console.warn('Consulta do pedido indisponível:',e.message)}
}
function iniciarConsultaStatus(){clearInterval(statusTimer);consultarStatus();statusTimer=setInterval(consultarStatus,10000)}
$('chegueibtn').onclick=async()=>{
 if(!pedido||!access)return;
 $('chegueibtn').disabled=true;
 try{
  await json(await fetch(API+'/publico/pedidos/'+encodeURIComponent(pedido)+'/cheguei',{method:'POST',headers:{'X-Pedido-Token':access}}));
  $('chegada').classList.add('hidden');$('chegueistatus').textContent='Chegada registrada! Aguarde a entrega.';
 }catch(e){$('chegueistatus').textContent='Não foi possível avisar a equipe: '+e.message;$('chegueibtn').disabled=false}
};

fetch(API+'/cardapio').then(json).then(d=>{if(!Array.isArray(d)||!d.length)throw Error('Sem produtos cadastrados');catalogo=d;desenhar();resumo()}).catch(e=>{demo=true;catalogo=produtosDemo;desenhar();resumo();$('pedir').disabled=true;const aviso=document.createElement('p');aviso.style.color='#ffcf78';aviso.textContent='⚠️ Modo demonstração: o cardápio real não foi carregado ('+e.message+'). Pedidos e Pix desativados.';$('produtos').prepend(aviso)});
</script>
<script src="/bento-integracao.js"></script>
</html>
