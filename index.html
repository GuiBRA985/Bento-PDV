<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bento PDV — Cardápio</title>
<style>body{margin:0;background:#111;color:#faf5ea;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}a{color:#ffc15a}h1{color:#ffc15a}button,input,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #555}button{background:#e9a52b;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}input,select{background:#252525;color:white;max-width:100%}.item{padding:15px;border-bottom:1px solid #444;display:flex;justify-content:space-between;gap:10px}.panel{background:#222;border-radius:12px;padding:18px;margin:20px 0}.hidden{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}small{color:#bbb}#msg{white-space:pre-wrap;color:#ffcf78}</style>
<header><strong>🍔 BENTO PDV</strong><a href="/login/">Acesso funcionários</a></header>
<main><h1>Faça seu pedido</h1><p>Escolha seus produtos. Sem cadastro.</p>
<div class="panel"><label><input type="radio" name="tipo" value="gps" checked> Estou a caminho (GPS)</label><br><label><input type="radio" name="tipo" value="estacionado"> Estou estacionado</label>
<div id="gpsbox"><p>Compartilhe a localização durante a viagem para que a cozinha acompanhe sua chegada.</p><button id="gpsbtn" type="button">Ativar localização</button> <small id="gpsstatus">Localização desativada</small></div>
<div id="carbox" class="hidden"><p><input id="modelo" placeholder="Modelo do carro" maxlength="50"> <input id="cor" placeholder="Cor" maxlength="30"> <input id="placa" placeholder="Final da placa" maxlength="4"></p></div></div>
<div id="produtos" class="panel">Carregando cardápio...</div>
<div class="panel"><h2>Seu pedido</h2><div id="resumo">Carrinho vazio</div><p><input id="nome" placeholder="Nome ou apelido" maxlength="70"></p><button id="pedir">Gerar cobrança Pix</button><p id="msg" role="status"></p><div id="cobranca"></div></div></main>
<script>
const API='https://bento-pdv.onrender.com';
let catalogo=[],carrinho={},gps=null,watchId=null,pedido=null,access=null,demo=false;
const produtosDemo=[{id:'demo-1',nome:'X-Burger',preco:18.9},{id:'demo-2',nome:'X-Salada',preco:22.9},{id:'demo-3',nome:'X-Bacon',preco:27.9},{id:'demo-4',nome:'X-Tudo',preco:32.9},{id:'demo-5',nome:'Combo X-Burger + Refrigerante Lata',preco:24.9},{id:'demo-6',nome:'Combo X-Bacon + Refrigerante Lata',preco:33.9},{id:'demo-7',nome:'Combo Duplo + Refrigerante Lata',preco:39.9},{id:'demo-8',nome:'Refrigerante Cola Lata 350 ml',preco:7},{id:'demo-9',nome:'Refrigerante Guaraná Lata 350 ml',preco:7},{id:'demo-10',nome:'Refrigerante Laranja Lata 350 ml',preco:7}];
const $=id=>document.getElementById(id), dinheiro=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function tipo(){return document.querySelector('input[name=tipo]:checked').value}
function atualizarTipo(){ $('gpsbox').classList.toggle('hidden',tipo()!=='gps');$('carbox').classList.toggle('hidden',tipo()!=='estacionado'); }
document.querySelectorAll('[name=tipo]').forEach(x=>x.addEventListener('change',atualizarTipo));
$('gpsbtn').onclick=()=>{if(!navigator.geolocation){$('gpsstatus').textContent='GPS indisponível';return}
 watchId=navigator.geolocation.watchPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gpsstatus').textContent='Localização ativa';if(pedido&&access)fetch(API+'/publico/pedidos/'+pedido+'/gps',{method:'POST',headers:{'Content-Type':'application/json','X-Pedido-Token':access},body:JSON.stringify(gps)}).catch(()=>{})},e=>{$('gpsstatus').textContent='Sem localização: '+e.message},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});};
function desenhar(){ $('produtos').innerHTML='';catalogo.forEach(i=>{const d=document.createElement('div');d.className='item';const txt=document.createElement('span');txt.textContent=i.nome+' — '+dinheiro(i.preco);const b=document.createElement('button');b.textContent='Adicionar';b.onclick=()=>{carrinho[i.id]=(carrinho[i.id]||0)+1;resumo()};d.append(txt,b);$('produtos').append(d)});}
function resumo(){ $('resumo').innerHTML='';let total=0;catalogo.forEach(i=>{let q=carrinho[i.id]||0;if(!q)return;total+=q*Number(i.preco);const d=document.createElement('p');d.textContent=q+' × '+i.nome+' — '+dinheiro(q*i.preco)+' ';const b=document.createElement('button');b.textContent='−';b.onclick=()=>{carrinho[i.id]--;resumo()};d.append(b);$('resumo').append(d)});const t=document.createElement('strong');t.textContent='Total: '+dinheiro(total);$('resumo').append(t);}
async function json(r){const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.erro||'Erro '+r.status);return x}
$('pedir').onclick=async()=>{if(demo){$('msg').textContent='Cardápio demonstrativo: pedidos e Pix desativados até a API voltar.';return;}const itens=Object.entries(carrinho).filter(([,q])=>q>0).map(([id,qty])=>({id,qty}));if(!itens.length)return $('msg').textContent='Escolha ao menos um produto.';
if(tipo()==='gps'&&!gps)return $('msg').textContent='Ative a localização GPS para pedido a caminho.';
const veiculo={modelo:$('modelo').value.trim(),cor:$('cor').value.trim(),placa:$('placa').value.trim()};
if(tipo()==='estacionado'&&(!veiculo.modelo||!veiculo.cor||!veiculo.placa))return $('msg').textContent='Informe modelo, cor e final da placa.';
$('pedir').disabled=true;try{const data=await json(await fetch(API+'/publico/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:$('nome').value.trim(),tipo:tipo(),veiculo,gps,itens})}));pedido=data.id;access=data.token;
$('msg').textContent='Pedido registrado. Aguardando emissão de cobrança pelo Sicredi.';if(data.pixCopiaCola){$('cobranca').textContent='Pix Copia e Cola: '+data.pixCopiaCola}else{$('cobranca').textContent='Pagamento indisponível até ativação da API Pix Sicredi.'}
}catch(e){$('msg').textContent=e.message}finally{$('pedir').disabled=false}};
fetch(API+'/cardapio').then(json).then(d=>{if(!Array.isArray(d)||!d.length)throw Error('Sem produtos cadastrados');catalogo=d;desenhar();resumo()}).catch(e=>{demo=true;catalogo=produtosDemo;desenhar();resumo();$('pedir').disabled=true;const aviso=document.createElement('p');aviso.style.color='#ffcf78';aviso.textContent='⚠️ Modo demonstração: o cardápio real não foi carregado ('+e.message+'). Pedidos e Pix desativados.';$('produtos').prepend(aviso)});
</script></html>
