<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bento PDV | Cozinha</title><style>:root{font-family:system-ui,Arial;background:#111;color:#faf5ea}*{box-sizing:border-box}body{margin:0}header,main{max-width:1080px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #373737}h1{color:#ffc15a;margin:0}h2{margin:0 0 10px}.panel,.pedido{background:#222;border:1px solid #444;border-radius:15px;padding:20px;margin:16px 0}.pedido.urgente{border:2px solid #ef5757;box-shadow:0 0 20px #e33a3a33}.pedido.chegou{border-color:#45b97c}input,button{font:inherit;border-radius:9px;padding:13px;border:1px solid #555}input{background:#161616;color:#fff;width:100%;margin:6px 0 14px}button{cursor:pointer;background:#ffc15a;color:#111;font-weight:700}button:disabled{opacity:.45;cursor:default}.secondary{background:#333;color:#fff}.success{background:#228553;color:white}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.muted{color:#bdbdbd}.tag{display:inline-block;background:#343434;padding:6px 10px;border-radius:20px;font-size:13px}.timer{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}.timer.late{color:#ff6666}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.error{color:#ff9999}.items{padding-left:20px}small{color:#aaa}#login{max-width:430px;margin:50px auto}</style></head><body><header><h1>🍔 BENTO PDV · COZINHA</h1><button id="sair" class="secondary hidden">Sair</button></header><main><section id="login" class="panel"><h2>Acesso da Cozinha</h2><label>Usuário<input id="usuario" autocomplete="username" placeholder="Usuário da cozinha"></label><label>Senha<input id="senha" type="password" autocomplete="current-password" placeholder="Senha"></label><button id="entrar">Entrar</button><p id="erroLogin" class="error" role="alert"></p></section><section id="painel" class="hidden"><div class="row"><div><h2>Pedidos confirmados</h2><p class="muted">Preparação opcional · Pronto encaminha ao garçom · Entregue encerra</p></div><span id="atualizado" class="muted"></span></div><p id="erroPedidos" class="error" role="alert"></p><div id="lista" class="grid"></div></section></main><script>
'use strict';
const API='https://bento-pdv.onrender.com';let token=sessionStorage.getItem('bento_cozinha_token')||'';let perfil=sessionStorage.getItem('bento_cozinha_perfil')||'';let pedidos=[];const $=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mostrar(){const ok=!!token&&['cozinha','admin'].includes(perfil);$('login').classList.toggle('hidden',ok);$('painel').classList.toggle('hidden',!ok);$('sair').classList.toggle('hidden',!ok);if(ok)carregar();}
$('entrar').onclick=async()=>{ $('erroLogin').textContent='';try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:$('usuario').value.trim(),senha:$('senha').value})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Falha no login');if(!['cozinha','admin'].includes(d.perfil))throw Error('Acesso permitido apenas à Cozinha ou ao administrador.');token=d.token;perfil=d.perfil;sessionStorage.setItem('bento_cozinha_token',token);sessionStorage.setItem('bento_cozinha_perfil',perfil);$('senha').value='';mostrar();}catch(e){ $('erroLogin').textContent=e.message;}};
$('senha').addEventListener('keydown',e=>{if(e.key==='Enter')$('entrar').click()});$('sair').onclick=()=>{token='';perfil='';sessionStorage.removeItem('bento_cozinha_token');sessionStorage.removeItem('bento_cozinha_perfil');mostrar()};
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(r.status===401){$('sair').click();throw Error('Sessão expirada. Entre novamente.')}if(!r.ok)throw Error(d.erro||'Erro na API');return d;}
const pago=p=>p.pagamento_status==='confirmado'||p.status_pagamento==='confirmado'||p.pagamento_confirmado===true;
function faltam(p){const prazo=p.retirada_em||(p.criado_em&&p.tempo_retirada_min?new Date(new Date(p.criado_em).getTime()+Number(p.tempo_retirada_min)*60000).toISOString():null);return prazo?Math.floor((new Date(prazo)-Date.now())/1000):null;}
function tempo(s){if(s===null)return 'Não informado';const v=Math.abs(s);return (s<0?'−':'')+String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');}
function cartao(p){const s=faltam(p),atrasado=s!==null&&s<=0,chegou=!!p.chegou_em||p.chegou===true;const itens=(p.itens_pedido||[]).map(i=>`<li>${escapeHtml(i.qty)} × ${escapeHtml(i.nome_snap||i.cardapio?.nome||'Item')}</li>`).join('');const veiculo=[p.carro_modelo||p.modelo_carro,p.carro_cor||p.cor_carro,p.placa_final||p.final_placa].filter(Boolean).join(' · ');const gps=p.distancia_km!=null?`${Number(p.distancia_km).toFixed(1)} km`:'Distância não informada';return `<article class="pedido ${atrasado?'urgente':''} ${chegou?'chegou':''}"><div class="row"><h2>Pedido #${escapeHtml(p.id)}</h2><span class="tag">${escapeHtml(p.status)}</span></div><strong>${escapeHtml(p.cliente||'Cliente')}</strong><p class="muted">${veiculo?'🚗 '+escapeHtml(veiculo):'📍 GPS: '+escapeHtml(gps)}</p><p>${chegou?'🟢 CLIENTE CHEGOU':''}</p><div class="timer ${atrasado?'late':''}" data-prazo="${escapeHtml(p.retirada_em||'')}">${tempo(s)}</div><small>${atrasado?'⚠ Prazo encerrado — prioridade até entregar':'Tempo restante para retirada'}</small><ul class="items">${itens}</ul>${p.obs?`<p>Observação: ${escapeHtml(p.obs)}</p>`:''}<div class="actions"><button class="secondary" data-status="preparo" data-id="${escapeHtml(p.id)}" ${p.status!=='aberto'?'disabled':''}>Em preparação</button><button data-status="pronto" data-id="${escapeHtml(p.id)}" ${p.status==='pronto'?'disabled':''}>Pronto → Garçom</button><button class="success" data-status="entregue" data-id="${escapeHtml(p.id)}">Entregue</button></div></article>`;}
function render(){const ativos=pedidos.filter(p=>p.status!=='entregue'&&p.status!=='cancelado'&&p.status!=='pronto'&&pago(p));ativos.sort((a,b)=>(faltam(a)??Infinity)-(faltam(b)??Infinity));$('lista').innerHTML=ativos.length?ativos.map(cartao).join(''):'<div class="panel">Nenhum pedido com pagamento confirmado aguardando na Cozinha.</div>';}
async function carregar(){if(!token)return;try{const d=await api('/pedidos');pedidos=Array.isArray(d)?d:[];render();$('erroPedidos').textContent='';$('atualizado').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');}catch(e){$('erroPedidos').textContent=e.message;}}
$('lista').addEventListener('click',async e=>{const b=e.target.closest('button[data-status]');if(!b)return;const status=b.dataset.status,id=b.dataset.id;if(status==='entregue'&&!confirm('Confirmar entrega do pedido #'+id+'?'))return;b.disabled=true;try{await api('/pedidos/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status})});await carregar();}catch(err){$('erroPedidos').textContent=err.message;b.disabled=false;}});
setInterval(()=>{if(token)carregar()},10000);setInterval(()=>{if(token)render()},1000);mostrar();
</script></body></html>
